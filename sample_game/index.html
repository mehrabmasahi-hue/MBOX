<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>M BOX Neon Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071023;color:#eef8ff;font-family:Tahoma,Arial,sans-serif}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:14px 18px auto 18px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.glass{background:#0a1a37c9;border:1px solid #80d9ff3b;border-radius:14px;padding:9px 14px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0005;font-size:13px}.players{display:flex;gap:7px;flex-wrap:wrap}.player{border:1px solid #8acaff44;border-radius:10px;padding:7px 10px;font-size:11px}.player b{color:#8feaff}.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;white-space:nowrap;color:#a9c8e9;font-size:12px;text-shadow:0 2px 10px #000}.countdown{position:fixed;inset:0;display:grid;place-items:center;background:#020815b9;z-index:3;font-size:clamp(50px,13vw,130px);font-weight:900;color:#a7eeff;text-shadow:0 0 45px #40cfff}.hidden{display:none}
</style></head><body>
<canvas id="game"></canvas><div class="hud"><div class="glass"><b style="color:#90eaff">M BOX</b> • NEON ARENA</div><div class="glass players" id="players"></div></div><div class="hint">با جهت‌ها حرکت کن • گاز سرعت را بیشتر می‌کند • نیترو شتاب می‌دهد</div><div class="countdown" id="count">آماده؟</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),playerPanel=document.getElementById('players'),count=document.getElementById('count');
let w=0,h=0,dpr=1,started=false,last=0;
const colors=['#59e8ff','#a58aff','#ff8baf','#72efb0'];
const cars=Array.from({length:4},(_,i)=>({x:0,y:0,vx:0,vy:0,trail:[],distance:0,angle:0}));
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cars.forEach((c,i)=>{if(!c.x){c.x=w*(.25+(i%2)*.5);c.y=h*(.35+Math.floor(i/2)*.32)}})}
addEventListener('resize',resize);resize();
function inputFor(i){const all=window.MBOX_INPUT||{};const p=(all.players||[]).find(x=>x.player===i+1);return (p && p.input) || all['player'+(i+1)] || {}}
function drawGrid(t){ctx.fillStyle='#071023';ctx.fillRect(0,0,w,h);ctx.save();ctx.strokeStyle='rgba(81,145,220,.13)';ctx.lineWidth=1;const s=46,offset=(t*.018)%s;for(let x=-s;x<w+s;x+=s){ctx.beginPath();ctx.moveTo(x+offset,0);ctx.lineTo(x+offset,h);ctx.stroke()}for(let y=-s;y<h+s;y+=s){ctx.beginPath();ctx.moveTo(0,y+offset);ctx.lineTo(w,y+offset);ctx.stroke()}ctx.restore();ctx.save();ctx.strokeStyle='rgba(101,194,255,.3)';ctx.lineWidth=3;ctx.strokeRect(20,20,w-40,h-40);ctx.restore()}
function update(dt){for(let i=0;i<4;i++){const c=cars[i],p=inputFor(i);let ax=0,ay=0;const boost=p.nitro?2.7:p.gas?1.65:1;const speed=260*boost;if(p.left)ax-=1;if(p.right)ax+=1;if(p.up)ay-=1;if(p.down)ay+=1;if(p.brake){ax*=.45;ay*=.45}const len=Math.hypot(ax,ay)||1;c.vx=(c.vx+ax/len*speed*dt)*.88;c.vy=(c.vy+ay/len*speed*dt)*.88;c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.x<36){c.x=36;c.vx=Math.abs(c.vx)*.6}if(c.x>w-36){c.x=w-36;c.vx=-Math.abs(c.vx)*.6}if(c.y<36){c.y=36;c.vy=Math.abs(c.vy)*.6}if(c.y>h-36){c.y=h-36;c.vy=-Math.abs(c.vy)*.6}c.distance+=Math.hypot(c.vx,c.vy)*dt;c.trail.push([c.x,c.y]);if(c.trail.length>24)c.trail.shift();if(Math.hypot(c.vx,c.vy)>1)c.angle=Math.atan2(c.vy,c.vx)}}
function drawCar(c,i){const color=colors[i];ctx.save();for(let k=0;k<c.trail.length;k++){const q=c.trail[k],a=(k+1)/c.trail.length;ctx.globalAlpha=a*.24;ctx.fillStyle=color;ctx.beginPath();ctx.arc(q[0],q[1],3+a*5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowColor=color;ctx.shadowBlur=24;ctx.translate(c.x,c.y);ctx.rotate(c.angle);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-11,-13);ctx.lineTo(12,-13);ctx.quadraticCurveTo(20,-13,20,-5);ctx.lineTo(20,5);ctx.quadraticCurveTo(20,13,12,13);ctx.lineTo(-11,13);ctx.quadraticCurveTo(-20,13,-20,5);ctx.lineTo(-20,-5);ctx.quadraticCurveTo(-20,-13,-11,-13);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#08142e';ctx.fillRect(-8,-9,18,18);ctx.fillStyle='#e9fbff';ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(8,-5);ctx.lineTo(8,5);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='#f5fbff';ctx.font='bold 12px Tahoma';ctx.textAlign='center';ctx.fillText('P'+(i+1),c.x,c.y-23)}
function frame(t){const dt=Math.min((t-last)/1000||0,.04);last=t;drawGrid(t);if(started)update(dt);cars.forEach(drawCar);requestAnimationFrame(frame)}
function refreshPanel(){const all=window.MBOX_INPUT||{},players=all.players||[];playerPanel.innerHTML='';for(let i=1;i<=4;i++){const p=players.find(x=>x.player===i);const el=document.createElement('div');el.className='player';el.innerHTML='<b style="color:'+colors[i-1]+'">P'+i+'</b> '+(p?p.name:'آزاد');playerPanel.appendChild(el)}}
setInterval(refreshPanel,500);window.addEventListener('mboxinput',refreshPanel);window.addEventListener('mboxstart',()=>{started=true;count.classList.add('hidden')});requestAnimationFrame(frame);
</script></body></html>
