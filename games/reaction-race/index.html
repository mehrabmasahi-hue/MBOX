<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#20365b,#080d18 70%);color:#fff;font-family:system-ui;text-align:center;padding:5vh 4vw}h1{color:#4ce5d5;font-size:clamp(25px,5vw,48px)}#signal{font-size:clamp(28px,7vw,70px);font-weight:900;margin:7vh 0;color:#ffcf5b}.scores{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.score{background:#17243a;border:1px solid #3c5578;border-radius:15px;padding:18px;min-width:110px}.score b{display:block;font-size:30px;color:#4ce5d5}.tip{color:#9aabc5}</style>
<h1>🏁 مسابقه واکنش</h1><p>وقتی علامت سبز شد، دکمه A را بزنید!</p><div id="signal">آماده باشید...</div><div class="scores" id="scores"></div><p class="tip">این صفحه روی نمایشگر اصلی است؛ هر بازیکن با دسته گوشی خود بازی می‌کند.</p>
<script>
const scores={},names={};let ready=false,started=false,timer;
function draw(){document.getElementById('scores').innerHTML=Object.keys(scores).sort().map(id=>`<div class="score">بازیکن ${id.slice(1)}<b>${scores[id]}</b>امتیاز</div>`).join('')}
function begin(){ready=false;started=false;document.getElementById('signal').style.color='#ffcf5b';document.getElementById('signal').textContent='منتظر علامت بمانید...';clearTimeout(timer);timer=setTimeout(()=>{ready=true;started=true;document.getElementById('signal').style.color='#48ed91';document.getElementById('signal').textContent='حالاااا! A را بزنید!'},1800+Math.random()*3500)}
window.addEventListener('message',e=>{const d=e.data;if(d?.type!=='MBOX_INPUT'||d.input?.action!=='down'||d.input?.button!=='A')return;const id=d.player_id;if(!(id in scores))scores[id]=0;if(ready){scores[id]+=10;ready=false;document.getElementById('signal').textContent='بازیکن '+id.slice(1)+' زودتر زد! +۱۰';draw();setTimeout(begin,1600)}else if(!started){document.getElementById('signal').textContent='زود زدی! صبر کن';scores[id]=Math.max(0,scores[id]-2);draw()}});begin();draw();
</script></html>
