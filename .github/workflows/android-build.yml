name: M BOX Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleControllerDebug assembleDisplayDebug assembleControllerRelease assembleDisplayRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MBOX-Android-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
